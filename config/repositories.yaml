# Repository Configuration for Code Ingestion System
#
# This file defines all repositories to be ingested into the vector database.
#
# Configuration path can be overridden via REPOSITORIES_CONFIG environment variable.
# Default location: config/repositories.yaml
#
# --- Minimal entry (only github_url required) ---
# Other fields are defaulted: id = repo name from URL, repo_type = backend,
# languages = [rust, yaml], components = [.], priority = medium. Discovery
# (modules/ingest/scripts/repo_discovery.py) fills in Helm, languages and repo
# type after cloning.
#
# --- Full schema (optional fields for better context) ---
# id, repo_type, languages, components, priority, has_helm, helm_path,
# service_dependencies, exposes_apis, api_base_path
#
# --- Inclusion rule (last synced 2026-10-14 from `gh repo list eco|eco-incorp`) ---
# Every non-archived, non-empty repo in the eco and eco-incorp orgs whose default
# branch received a commit in the last 12 months, except:
#   - GitHub security-advisory forks (eco-routes-ghsa-*, eco-routes-svm-ghsa-*)
#   - eco-incorp/sauce-old (superseded by eco-incorp/sauce)
#   - eco-incorp/workflows: clone directories are keyed by repo name, so it
#     would collide with eco/workflows
# Repo names must be unique across both orgs for the same reason.

# Base directory for cloning repositories (default: ./repos)
repos_base_dir: ./repos

