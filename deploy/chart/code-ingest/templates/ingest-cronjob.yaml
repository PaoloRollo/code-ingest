{{- if .Values.ingest.enabled }}
{{- $selector := dict "root" . "component" "ingest" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "code-ingest.fullname" . }}-ingest
  labels:
    {{- include "code-ingest.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  schedule: {{ .Values.ingest.schedule | quote }}
  {{- with .Values.ingest.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.ingest.suspend }}
  concurrencyPolicy: {{ .Values.ingest.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.ingest.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ingest.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.ingest.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.ingest.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "code-ingest.selectorLabels" $selector | nindent 12 }}
          {{- with .Values.ingest.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "code-ingest.serviceAccountName" . }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: ingest
              image: {{ include "code-ingest.image" $selector | quote }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                {{- include "code-ingest.commonEnv" . | nindent 16 }}
                - name: PRIORITY
                  value: {{ .Values.ingest.priority | quote }}
                - name: BATCH_SIZE
                  value: {{ .Values.ingest.batchSize | quote }}
                - name: EMBEDDING_TIMEOUT
                  value: {{ .Values.ingest.embeddingTimeout | quote }}
                {{- with .Values.ingest.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- include "code-ingest.envFrom" . | nindent 14 }}
              resources:
                {{- toYaml .Values.ingest.resources | nindent 16 }}
              {{- if or .Values.ingest.reposCache.enabled .Values.secretProviderClass.name }}
              volumeMounts:
                {{- if .Values.ingest.reposCache.enabled }}
                - name: repos
                  mountPath: /app/repos
                {{- end }}
                {{- include "code-ingest.spcVolumeMount" . | nindent 16 }}
              {{- end }}
          {{- if or .Values.ingest.reposCache.enabled .Values.secretProviderClass.name }}
          volumes:
            {{- if .Values.ingest.reposCache.enabled }}
            - name: repos
              persistentVolumeClaim:
                claimName: {{ include "code-ingest.reposCacheClaim" . }}
            {{- end }}
            {{- include "code-ingest.spcVolume" . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
