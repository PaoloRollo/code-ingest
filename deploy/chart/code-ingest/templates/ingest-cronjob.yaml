{{- if .Values.ingest.enabled }}
{{- $component := dict "root" . "component" "ingest" }}
{{- $state := "/app/repos/.code-ingest-state" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "code-ingest.fullname" . }}-ingest
  labels:
    {{- include "code-ingest.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  schedule: {{ .Values.ingest.schedule | quote }}
  {{- with .Values.ingest.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.ingest.suspend }}
  concurrencyPolicy: {{ .Values.ingest.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.ingest.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ingest.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.ingest.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.ingest.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "code-ingest.selectorLabels" $component | nindent 12 }}
          {{- with .Values.ingest.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "code-ingest.serviceAccountName" $component }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: ingest
              image: {{ include "code-ingest.image" $component | quote }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                {{- include "code-ingest.commonEnv" . | nindent 16 }}
                - name: PRIORITY
                  value: {{ .Values.ingest.priority | quote }}
                - name: BATCH_SIZE
                  value: {{ .Values.ingest.batchSize | quote }}
                - name: EMBEDDING_TIMEOUT
                  value: {{ .Values.ingest.embeddingTimeout | quote }}
                # Discovery/relationship overlays live next to the clones
                # instead of in the read-only image config dir: relationships
                # derived at the end of one run feed the next run's load.
                - name: REPOSITORIES_DISCOVERED_CONFIG
                  value: {{ printf "%s/repositories-discovered.yaml" $state | quote }}
                - name: REPOSITORIES_RELATIONSHIPS_CONFIG
                  value: {{ printf "%s/repositories-relationships.yaml" $state | quote }}
                # Per run, deliberately not persisted: every run is a full
                # re-ingestion and Jobs don't retry, so a checkpoint left by a
                # failed run would only make the next one skip changed files.
                - name: CHECKPOINT_FILE
                  value: /tmp/ingestion_checkpoint.json
                {{- include "code-ingest.secretFileEnv" $component | nindent 16 }}
                {{- with .Values.ingest.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.ingest.resources | nindent 16 }}
              volumeMounts:
                - name: repos
                  mountPath: /app/repos
                - name: status
                  mountPath: /app/status
                - name: tmp
                  mountPath: /tmp
                {{- include "code-ingest.spcVolumeMount" $component | nindent 16 }}
          volumes:
            - name: repos
              {{- if .Values.ingest.reposCache.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "code-ingest.reposCacheClaim" . }}
              {{- else }}
              emptyDir: {}
              {{- end }}
            - name: status
              emptyDir:
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            {{- include "code-ingest.spcVolume" $component | nindent 12 }}
          {{- with .Values.ingest.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
