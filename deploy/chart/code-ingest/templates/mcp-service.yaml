{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "code-ingest.fullname" . }}-mcp
  labels:
    {{- include "code-ingest.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "code-ingest.selectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}
{{- end }}
