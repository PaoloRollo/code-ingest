{{- if .Values.serviceAccount.create }}
{{- range $component := list "mcp" "ingest" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "code-ingest.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "code-ingest.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither workload talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
