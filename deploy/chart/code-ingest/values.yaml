# Defaults for the code-ingest chart. Environment overrides live in app-deploy
# (envs/ss-ai-513051133833/ai/code-ingest/values.yaml). values.schema.json
# rejects unknown keys.

nameOverride: ""
fullnameOverride: ""

# Both images are built by .github/workflows/images.yml. `tag` must be the
# digest-pinned form CI reports, `sha-<short>@sha256:<digest>`: a bare tag is
# rejected by the schema so what runs is always the exact bytes CI built.
images:
  pullPolicy: IfNotPresent
  mcp:
    repository: code-ingest/mcp
    tag: ""
  ingest:
    repository: code-ingest/ingest
    tag: ""

# One ServiceAccount per component (<fullname>-mcp, <fullname>-ingest), so each
# can get its own Pod Identity role and only the secrets it needs.
serviceAccount:
  create: true
  annotations: {}

qdrant:
  url: http://qdrant:6333

# Must be identical for ingest and MCP: query vectors have to come from the
# same model that produced the stored vectors.
embeddingModel: Qwen/Qwen3-Embedding-8B
logLevel: INFO

# Both images run as an arbitrary non-root UID on a read-only root filesystem;
# everything they write goes to the emptyDir/PVC mounts the templates add.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

# Credentials are delivered as files from a Secrets Store CSI SecretProviderClass
# mounted at /mnt/secrets-store, never as Kubernetes Secrets. `secretFiles` maps
# an env var to an object alias in that mount; the chart sets <VAR>_FILE and the
# entrypoint exports <VAR> from the file (docker/load-secret-files.sh).
# Supported variables: mcp → DEEPINFRA_API_KEY, QDRANT_API_KEY;
# ingest → DEEPINFRA_API_KEY, GITHUB_TOKEN, QDRANT_API_KEY.

mcp:
  enabled: true
  replicaCount: 1
  port: 8001
  secretProviderClass: ""
  secretFiles: {}
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # /health returns 503 until Qdrant holds ingested points (and whenever Qdrant
  # is unreachable), so it gates readiness only. Startup/liveness check the
  # listener: an empty store or a Qdrant blip must not restart the server.
  probes:
    startup:
      tcpSocket: {port: http}
      periodSeconds: 5
      failureThreshold: 60
    readiness:
      httpGet: {path: /health, port: http}
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      tcpSocket: {port: http}
      periodSeconds: 30
      failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

ingest:
  enabled: true
  schedule: "0 4 * * *"
  timeZone: Etc/UTC
  suspend: false
  # A run that overlaps the next schedule would race on the repo cache volume.
  concurrencyPolicy: Forbid
  # Full re-ingestion of ~120 repos; fail the Job rather than let it hang forever.
  activeDeadlineSeconds: 21600
  backoffLimit: 0
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Minimum repo priority to clone and ingest (high | medium | low | ALL).
  priority: low
  batchSize: 15
  embeddingTimeout: 120
  secretProviderClass: ""
  secretFiles: {}
  resources:
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      memory: 4Gi
  # Persistent clone cache so scheduled runs `git pull` instead of re-cloning.
  # It also holds the discovery/relationship overlays under
  # /app/repos/.code-ingest-state, so derived dependencies carry over to the
  # next run. Disabled → an emptyDir that lives for one run.
  reposCache:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    size: 50Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
